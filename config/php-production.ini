; Immutable production containers keep compiled PHP in memory between requests.
expose_php=Off
display_errors=Off
log_errors=On
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.jit=0
upload_max_filesize=5M
post_max_size=48M
max_file_uploads=8
