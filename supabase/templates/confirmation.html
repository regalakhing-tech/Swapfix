<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify your SwapFix email</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f6fc;color:#0b1930;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f3f6fc;">
        <tr>
            <td align="center" style="padding:32px 16px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;background-color:#ffffff;border:1px solid #dbe4f3;border-top:5px solid #1046d1;border-radius:16px;">
                    <tr>
                        <td style="padding:26px 24px 20px;border-bottom:1px solid #e7edf6;">
                            <img src="https://swapfix.vercel.app/assets/images/swapfix-logo.17c8a654ae.png" width="164" alt="SwapFix" style="display:block;width:164px;max-width:100%;height:auto;border:0;font-size:20px;font-weight:bold;color:#1046d1;">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:24px;">
                            <h1 style="margin:0 0 12px;font-size:27px;line-height:1.2;letter-spacing:-.5px;color:#0b1930;">Verify your email</h1>
                            <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#465873;">Enter this verification code in SwapFix to finish creating your account.</p>
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td align="center" style="padding:18px 10px;background-color:#edf3ff;border:1px solid #cddbf9;border-radius:12px;color:#103eaf;">
                                        <span style="font-family:Consolas,Monaco,monospace;font-size:32px;font-weight:bold;line-height:1.2;letter-spacing:6px;">{{ .Token }}</span>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:18px 0 0;font-size:14px;line-height:1.6;color:#465873;">Return to the SwapFix tab where you signed up. If the code expires, request a new one there.</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 24px;border-top:1px solid #e7edf6;font-size:13px;line-height:1.6;color:#465873;">
                            Keep this code private. If you didn’t create a SwapFix account, you can ignore this email.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
